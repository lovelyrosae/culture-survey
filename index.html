<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 문화차원 자가진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --ink: #1c2330;
    --muted: #5d6675;
    --line: #dde2ea;
    --bg: #f5f6f8;
    --card: #ffffff;
    --accent: #1f4e79;
    --accent-soft: #e6eef6;
    --warn: #b4441f;
    --kr: #c0392b;
    --us: #2e7d5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 80px; }
  header.top { padding: 40px 0 20px; }
  h1 { font-size: 1.75rem; margin: 0 0 6px; letter-spacing: -0.02em; color: var(--accent); }
  .sub { color: var(--muted); margin: 0; }
  .guide {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin: 20px 0;
  }
  .guide p { margin: 0 0 8px; }
  .guide p:last-child { margin: 0; }
  .scale-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem; color: var(--muted); }
  .scale-legend b { color: var(--ink); }

  .progress {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .progress-row { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin: 12px 0; transition: border-color .2s, box-shadow .2s;
  }
  .item.missing { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(180,68,31,.12); }
  .q { display: flex; gap: 10px; margin: 0 0 12px; font-weight: 500; }
  .q .n { color: var(--accent); font-weight: 700; min-width: 1.6em; }
  .opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .opts input { position: absolute; opacity: 0; pointer-events: none; }
  .opts label {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 8px 2px; border: 1px solid var(--line); border-radius: 8px;
    cursor: pointer; user-select: none; font-size: .78rem; color: var(--muted);
    min-height: 56px; text-align: center; transition: all .15s;
  }
  .opts label b { font-size: 1.05rem; color: var(--ink); }
  .opts label:hover { border-color: var(--accent); }
  .opts input:checked + label { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opts input:checked + label b { color: #fff; }
  .opts input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }

  .name-box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 24px 0 12px; }
  .name-box label { font-weight: 600; display: block; margin-bottom: 6px; }
  .name-box input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 20px; border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  .btn.ghost { background: #fff; color: var(--accent); }
  .btn.wide { width: 100%; padding: 15px; font-size: 1.05rem; }
  .msg { color: var(--warn); font-size: .92rem; margin: 10px 0 0; min-height: 1.4em; text-align: center; }

  /* 결과 */
  #result { display: none; }
  .r-head { padding: 40px 0 8px; }
  .r-meta { color: var(--muted); font-size: .92rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .88rem; color: var(--muted); margin: 18px 0 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .tick { width: 3px; height: 14px; display: inline-block; border-radius: 1px; }
  .dim {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin: 12px 0; break-inside: avoid;
  }
  .dim-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .dim h3 { margin: 0; font-size: 1.08rem; }
  .dim h3 small { color: var(--muted); font-weight: 500; font-size: .85rem; }
  .score { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .score small { font-size: .85rem; color: var(--muted); font-weight: 500; }
  .track { position: relative; height: 12px; background: var(--accent-soft); border-radius: 6px; margin: 26px 0 6px; }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
  .track .mark { position: absolute; top: -5px; width: 3px; height: 22px; border-radius: 1px; transform: translateX(-50%); }
  .track .mark em {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-style: normal; font-size: .72rem; white-space: nowrap; font-weight: 600;
  }
  .ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); gap: 12px; }
  .ends span:last-child { text-align: right; }
  .level { display: inline-block; font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
  .interp { margin: 10px 0 0; font-size: .95rem; }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin: 20px 0; font-size: .9rem; color: var(--muted); }
  .note ul { margin: 6px 0 0; padding-left: 18px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
  .actions .btn { flex: 1 1 180px; }

  @media (max-width: 480px) {
    h1 { font-size: 1.45rem; }
    .opts label { font-size: .68rem; min-height: 52px; }
  }
  @media print {
    body { background: #fff; }
    #survey, .actions, .progress { display: none !important; }
    .dim, .note { border-color: #ccc; }
    .track, .track .fill, .mark, .dot, .tick { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="wrap">

<section id="survey">
  <header class="top">
    <h1>나의 문화차원 자가진단</h1>
    <p class="sub">호프스테드(Hofstede)의 6가지 문화차원 · 24문항</p>
  </header>

  <div class="guide">
    <p>각 문항을 읽고 자신의 생각과 가장 가까운 숫자를 고르세요. 정답은 없습니다. '그래야 한다'가 아니라 <b>'실제로 내가 그렇게 생각한다'</b>를 기준으로, 너무 오래 고민하지 말고 답하세요.</p>
    <div class="scale-legend">
      <span><b>1</b> 전혀 그렇지 않다</span><span><b>2</b> 그렇지 않다</span><span><b>3</b> 보통이다</span><span><b>4</b> 그렇다</span><span><b>5</b> 매우 그렇다</span>
    </div>
  </div>

  <div class="progress">
    <div class="progress-row"><span>응답 진행</span><span id="count">0 / 24</span></div>
    <div class="bar"><span id="barfill"></span></div>
  </div>

  <form id="form" novalidate></form>

  <div class="name-box">
    <label for="name">이름 또는 학번 (선택)</label>
    <input id="name" type="text" placeholder="결과 화면과 저장 파일에 표시됩니다" autocomplete="off">
  </div>

  <button class="btn wide" id="submit" type="button">결과 보기</button>
  <p class="msg" id="msg"></p>
</section>

<section id="result"></section>

</div>

<script>
const ITEMS = [
  "윗사람의 결정에는 이의가 있더라도 따르는 것이 바람직하다.",
  "진로나 결혼 같은 중요한 결정은 가족의 뜻보다 내 뜻이 우선이다.",
  "일에서 성공하고 인정받는 것이 내 삶에서 매우 중요하다.",
  "명확한 규칙과 절차가 있을 때 마음이 편하다.",
  "미래를 위해 지금의 즐거움을 미루는 것은 가치 있는 일이다.",
  "여가와 취미 활동은 내 삶에서 꼭 필요한 부분이다.",
  "교수나 상사의 의견에도 자유롭게 반박할 수 있어야 한다.",
  "집단의 화합을 위해서라면 내 의견을 접을 수 있다.",
  "높은 연봉보다 여유 있는 삶과 좋은 인간관계가 더 중요하다.",
  "계획이 갑자기 바뀌어도 크게 불편하지 않다.",
  "먼 미래를 준비하기보다 지금 이 순간을 즐기며 사는 것이 중요하다.",
  "일 없이 쉬고 있으면 불안하거나 죄책감이 든다.",
  "나이나 직급이 높은 사람에게는 특별한 예우를 갖추는 것이 당연하다.",
  "팀의 성과보다 내 개인의 성과를 인정받는 것이 더 중요하다.",
  "경쟁에서 이기는 것이 나에게 큰 동기가 된다.",
  "결과를 예측하기 어려운 일은 되도록 피하고 싶다.",
  "당장 손해를 보더라도 장기적으로 이득이 된다면 감수할 수 있다.",
  "하고 싶은 것이 있으면 참기보다 즐기는 편이다.",
  "중요한 결정은 직위와 관계없이 구성원 모두가 함께 내리는 것이 좋다.",
  "내가 잘되는 것은 가족이나 소속 집단의 명예이기도 하다.",
  "집안일과 육아는 성별과 관계없이 똑같이 나누는 것이 당연하다.",
  "안정적인 직장보다 변화가 많고 도전적인 일에 더 끌린다.",
  "오랫동안 지켜온 전통과 방식은 바꾸지 않는 것이 좋다.",
  "욕구나 감정은 드러내기보다 절제하는 것이 바람직하다."
];
const REVERSE = new Set([7,8,9,10,11,12,19,20,21,22,23,24]);
const LABELS = ["전혀 아니다","아니다","보통","그렇다","매우 그렇다"];

const DIMS = [
  { key:"PDI", name:"권력거리", en:"Power Distance", items:[1,13,7,19], kr:60, us:40,
    hi:"위계와 서열을 자연스럽게 받아들임", lo:"수평적 관계, 윗사람에게도 의견 제시",
    tHi:"윗사람의 판단과 위계 질서를 존중하는 편입니다. 역할과 서열이 분명한 환경에서 편안함을 느낄 수 있습니다.",
    tMid:"상황에 따라 위계를 존중하기도, 수평적 소통을 원하기도 하는 균형형입니다.",
    tLo:"지위와 관계없이 동등하게 의견을 나누는 관계를 선호합니다. 윗사람에게도 이의를 제기하는 것이 자연스럽습니다." },
  { key:"IDV", name:"개인주의", en:"Individualism", items:[2,14,8,20], kr:18, us:91,
    hi:"개인의 선택과 성취를 우선", lo:"가족·집단과의 조화와 소속을 우선",
    tHi:"나의 선택과 자율성, 개인의 성취를 중요하게 여깁니다.",
    tMid:"개인의 자율성과 집단과의 조화를 함께 고려하는 균형형입니다.",
    tLo:"가족과 소속 집단과의 조화, '우리'라는 유대를 중요하게 여깁니다." },
  { key:"MAS", name:"남성성", en:"Masculinity", items:[3,15,9,21], kr:39, us:62,
    hi:"성취·경쟁·성공 지향", lo:"배려·삶의 질·관계 지향",
    tHi:"성과와 성공, 경쟁에서의 승리가 중요한 동기가 됩니다.",
    tMid:"성취와 삶의 질을 함께 추구하는 균형형입니다.",
    tLo:"경쟁보다 협력과 배려, 여유 있는 삶과 관계의 질을 중시합니다." },
  { key:"UAI", name:"불확실성 회피", en:"Uncertainty Avoidance", items:[4,16,10,22], kr:85, us:46,
    hi:"규칙과 예측 가능성을 선호", lo:"모호함과 변화에 관대",
    tHi:"명확한 규칙과 계획, 예측 가능한 상황에서 안정감을 느낍니다.",
    tMid:"안정과 변화를 상황에 따라 받아들이는 균형형입니다.",
    tLo:"모호하고 새로운 상황에 비교적 관대하며, 변화와 도전을 즐기는 편입니다." },
  { key:"LTO", name:"장기지향성", en:"Long-Term Orientation", items:[5,17,11,23], kr:100, us:26,
    hi:"미래를 위해 인내하고 실용적으로 적응", lo:"현재와 전통을 중시",
    tHi:"미래의 보상을 위해 현재를 인내하고, 상황에 맞게 실용적으로 적응합니다.",
    tMid:"현재와 미래, 전통과 변화를 함께 고려하는 균형형입니다.",
    tLo:"지금의 삶과 오래 지켜온 전통·방식을 소중히 여깁니다." },
  { key:"IVR", name:"쾌락추구", en:"Indulgence", items:[6,18,12,24], kr:29, us:68,
    hi:"즐거움과 욕구 충족을 허용", lo:"욕구를 절제하고 규범을 중시",
    tHi:"여가와 즐거움을 삶의 중요한 부분으로 여기고, 감정과 욕구를 자유롭게 표현합니다.",
    tMid:"즐거움과 절제 사이에서 균형을 잡는 편입니다.",
    tLo:"욕구와 감정을 절제하고, 쉬는 것보다 해야 할 일을 우선하는 편입니다." }
];

const form = document.getElementById("form");
form.innerHTML = ITEMS.map((t, i) => {
  const n = i + 1;
  const opts = LABELS.map((lab, k) => {
    const v = k + 1, id = `q${n}_${v}`;
    return `<input type="radio" name="q${n}" id="${id}" value="${v}"><label for="${id}"><b>${v}</b>${lab}</label>`;
  }).join("");
  return `<div class="item" id="item${n}"><p class="q"><span class="n">${n}.</span><span>${t}</span></p><div class="opts">${opts}</div></div>`;
}).join("");

function answers() {
  const a = {};
  for (let n = 1; n <= 24; n++) {
    const c = form.querySelector(`input[name="q${n}"]:checked`);
    a[n] = c ? Number(c.value) : null;
  }
  return a;
}
function updateProgress() {
  const done = Object.values(answers()).filter(v => v !== null).length;
  document.getElementById("count").textContent = `${done} / 24`;
  document.getElementById("barfill").style.width = (done / 24 * 100) + "%";
}
form.addEventListener("change", e => {
  const item = e.target.closest(".item");
  if (item) item.classList.remove("missing");
  updateProgress();
  document.getElementById("msg").textContent = "";
});

function score(a) {
  return DIMS.map(d => {
    const vals = d.items.map(n => REVERSE.has(n) ? 6 - a[n] : a[n]);
    const mean = vals.reduce((s, v) => s + v, 0) / 4;
    return { ...d, mean, pct: Math.round((mean - 1) * 25) };
  });
}
function mark(v, color, label) {
  const shift = v >= 88 ? "-100%" : v <= 12 ? "0" : "-50%";
  return `<div class="mark" style="left:${v}%;background:${color}"><em style="color:${color};left:${v >= 88 ? "100%" : v <= 12 ? "0" : "50%"};transform:translateX(${shift})">${label} ${v}</em></div>`;
}
function level(mean) { return mean >= 3.5 ? "높음" : mean <= 2.5 ? "낮음" : "중간"; }
function esc(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function nowText() {
  const d = new Date(), p = x => String(x).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function resultHTML(res, name, when) {
  const who = name ? `${esc(name)} · ` : "";
  const cards = res.map(d => {
    const lv = level(d.mean);
    const txt = lv === "높음" ? d.tHi : lv === "낮음" ? d.tLo : d.tMid;
    return `<div class="dim">
      <div class="dim-top">
        <h3>${d.name} <small>${d.en}</small><span class="level">${lv}</span></h3>
        <div class="score">${d.pct}<small> / 100 · 평균 ${d.mean.toFixed(2)}</small></div>
      </div>
      <div class="track">
        <div class="fill" style="width:${d.pct}%"></div>
        ${mark(d.kr, "var(--kr)", "한국")}
        ${mark(d.us, "var(--us)", "미국")}
      </div>
      <div class="ends"><span>← ${d.lo}</span><span>${d.hi} →</span></div>
      <p class="interp">${txt}</p>
    </div>`;
  }).join("");
  return `<header class="r-head">
      <h1>나의 문화차원 결과</h1>
      <p class="r-meta">${who}${when}</p>
    </header>
    <div class="legend">
      <span><span class="dot" style="background:var(--accent)"></span>나의 점수 (0~100)</span>
      <span><span class="tick" style="background:var(--kr)"></span>한국</span>
      <span><span class="tick" style="background:var(--us)"></span>미국</span>
    </div>
    ${cards}
    <div class="note">
      <b>해석할 때 주의할 점</b>
      <ul>
        <li>점수는 (평균 − 1) × 25 로 0~100점으로 환산했습니다. 50점이 중간입니다.</li>
        <li>국가 점수는 호프스테드의 고전 데이터 기준입니다. 원래 <b>국가 수준</b>의 평균을 비교하기 위한 지표이므로, 개인 점수는 성찰을 위한 참고값으로만 보세요.</li>
        <li>한국인이라고 모두 한국 점수와 같지 않습니다. 국가 평균으로 개인을 판단하는 것을 <b>생태학적 오류</b>라고 합니다.</li>
        <li>이 진단은 수업용 간이 문항이며, 표준화된 검사가 아닙니다.</li>
      </ul>
    </div>`;
}

let last = null;

document.getElementById("submit").addEventListener("click", () => {
  const a = answers();
  const missing = Object.keys(a).filter(n => a[n] === null).map(Number);
  document.querySelectorAll(".item.missing").forEach(el => el.classList.remove("missing"));
  if (missing.length) {
    missing.forEach(n => document.getElementById("item" + n).classList.add("missing"));
    document.getElementById("msg").textContent = missing.length > 6 ? `아직 답하지 않은 문항이 ${missing.length}개 있습니다.` : `아직 답하지 않은 문항이 있습니다: ${missing.join(", ")}번`;
    document.getElementById("item" + missing[0]).scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const name = document.getElementById("name").value.trim();
  const when = nowText();
  const res = score(a);
  last = { a, res, name, when };

  const out = document.getElementById("result");
  out.innerHTML = resultHTML(res, name, when) + `
    <div class="actions">
      <button class="btn" id="saveHtml" type="button">결과 HTML 저장</button>
      <button class="btn ghost" id="saveCsv" type="button">CSV 저장</button>
      <button class="btn ghost" id="print" type="button">인쇄 / PDF 저장</button>
      <button class="btn ghost" id="retry" type="button">다시 하기</button>
    </div>`;
  document.getElementById("survey").style.display = "none";
  out.style.display = "block";
  window.scrollTo(0, 0);

  document.getElementById("saveHtml").onclick = saveHtml;
  document.getElementById("saveCsv").onclick = saveCsv;
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("retry").onclick = () => {
    form.reset(); updateProgress();
    out.style.display = "none"; out.innerHTML = "";
    document.getElementById("survey").style.display = "block";
    window.scrollTo(0, 0);
  };
});

function fileBase() {
  const safe = (last.name || "").replace(/[\\/:*?"<>|\s]+/g, "_");
  return "문화차원결과" + (safe ? "_" + safe : "") + "_" + last.when.slice(0, 10);
}
function download(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function saveHtml() {
  const css = document.querySelector("style").textContent;
  const fonts = document.querySelector('link[rel="stylesheet"]').outerHTML;
  const doc = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 문화차원 결과${last.name ? " - " + esc(last.name) : ""}</title>${fonts}
<style>${css} #result{display:block}</style></head>
<body><div class="wrap"><section id="result">${resultHTML(last.res, last.name, last.when)}</section></div></body></html>`;
  download(doc, fileBase() + ".html", "text/html;charset=utf-8");
}
function saveCsv() {
  const head = ["이름", "응답일시", ...Array.from({ length: 24 }, (_, i) => "Q" + (i + 1)),
    ...last.res.flatMap(d => [d.key + "_평균", d.key + "_환산"])];
  const row = [last.name, last.when, ...Array.from({ length: 24 }, (_, i) => last.a[i + 1]),
    ...last.res.flatMap(d => [d.mean.toFixed(2), d.pct])];
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  download("﻿" + head.map(q).join(",") + "\n" + row.map(q).join(",") + "\n", fileBase() + ".csv", "text/csv;charset=utf-8");
}
</script>
